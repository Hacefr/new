events {
    worker_connections 1024;
}

error_log /dev/stderr info;

http {
    access_log /dev/stdout;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 10000;

        location / {
            # Match any casing: "websocket", "WebSocket", "WEBSOCKET"
            if ($http_upgrade ~* "websocket") {
                proxy_pass http://127.0.0.1:25577;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_read_timeout 86400s;
                proxy_send_timeout 86400s;
                break;
            }

            # If opened in a web browser, show friendly online status
            return 200 '<!DOCTYPE html><html><body style="background:#121212;color:#eee;text-align:center;padding-top:60px;font-family:sans-serif;"><h1>🚪 Eaglercraft Gateway is Online</h1><p>Connect your Eaglercraft 1.12.2 client to: <code>wss://new-nqpf.onrender.com</code></p></body></html>';
            add_header Content-Type text/html;
        }
    }
}
